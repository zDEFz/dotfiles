# 01-terminal.conf

$bm {
    # Open Alacritty terminal
    $meta+Return             exec    $term
    Menu+Return              exec    $term
    Menu+KP_ENTER            exec    $term

    $meta+space              exec    $term \
    --config-file=/home/blu/.config/alacritty/alacritty.toml --class alacritty_floating --title "Floating Terminal" --working-directory $HOME
}
