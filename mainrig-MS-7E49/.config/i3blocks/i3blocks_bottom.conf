SCRIPT_DIR=/home/blu/.local/libexec/i3blocks
CUSTOM_DIR=/home/blu/.config/i3blocks/i3blocks/custom

[available_space_sys]
command=df -BGiB --output=used,size,pcent / | awk 'NR==2{t=$1" / "$2" "; if($3+0>=90) printf "<span foreground=\"#FF2A00\">%s</span>\n", t; else print t}'
interval=30
markup=pango
#color=#FFDF00

[playing_now]
command=printf "%s\n" "$(cat /dev/shm/libsnd_mpris_Ambient 2>/dev/null)" || true
interval=1
