SCRIPT_DIR=/home/blu/.local/libexec/i3blocks
CUSTOM_DIR=/home/blu/.config/i3blocks/i3blocks/custom

[available_space_sys]
color=#FFDF00
command=btrfs filesystem usage / 2>/dev/null | awk '/Data,single/ {for(i=1;i<=NF;i++) if($i~/^Used:/) {sub("Used:", "", $i); used=$i}} /Device size:/ {total=$3} END {print used " of " total}'
interval=30
markup=pango


[playing_now]
command=printf "%s\n" "$(cat /dev/shm/libsnd_mpris_Ambient 2>/dev/null)" || true
interval=1
